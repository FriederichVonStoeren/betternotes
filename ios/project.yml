# The Xcode project is generated from this file in CI (xcodegen generate). Never commit a .xcodeproj.
name: BetterNotes
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BetterNotesCore:
    path: ../core
targets:
  BetterNotes:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BetterNotesCore
    scheme:
      testTargets: [BetterNotesUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.friederichvonstoeren.betternotes
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: betternotes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  BetterNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BetterNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.friederichvonstoeren.betternotes.uitests
        GENERATE_INFOPLIST_FILE: YES
