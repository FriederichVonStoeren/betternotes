name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  format-ts:
    name: Format (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test, and write every valid fixture for the Swift tests
        working-directory: packages/format-ts
        run: |
          npm ci
          BN_OUT_DIR="$RUNNER_TEMP/ts-written" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ts-written
          path: ${{ runner.temp }}/ts-written
          if-no-files-found: error

  ios:
    name: iPad app (.ipa)
    runs-on: macos-26
    permissions:
      contents: write # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      # No Apple account in CI: build unsigned, SideStore signs on the iPad.
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project BetterNotes.xcodeproj \
            -scheme BetterNotes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BetterNotes.app Payload/
          zip -qry betternotes.ipa Payload
          ls -lh betternotes.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: betternotes-ipa
          path: ios/betternotes.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ios/betternotes.ipa \
            --title "$GITHUB_REF_NAME" --generate-notes \
            ${{ startsWith(github.ref_name, 'v0.0.') && '--prerelease' || '' }}
