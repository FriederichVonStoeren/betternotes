name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  format-ts:
    name: Format (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test, and write every valid fixture for the Swift tests
        working-directory: packages/format-ts
        run: |
          npm ci
          BN_OUT_DIR="$RUNNER_TEMP/ts-written" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: ts-written
          path: ${{ runner.temp }}/ts-written
          if-no-files-found: error

  core:
    name: Core (Swift)
    runs-on: macos-26
    needs: format-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ts-written
          path: ${{ runner.temp }}/ts-written
      - name: Test, read the TypeScript output, write every valid fixture for the TypeScript tests
        working-directory: core
        env:
          BN_FOREIGN_DIR: ${{ runner.temp }}/ts-written
          BN_OUT_DIR: ${{ runner.temp }}/swift-written
        run: swift test
      - uses: actions/upload-artifact@v4
        with:
          name: swift-written
          path: ${{ runner.temp }}/swift-written
          if-no-files-found: error

  format-cross:
    name: Format (TypeScript reads Swift output)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: swift-written
          path: ${{ runner.temp }}/swift-written
      - working-directory: packages/format-ts
        run: |
          npm ci
          BN_FOREIGN_DIR="$RUNNER_TEMP/swift-written" npm test

  ios:
    name: iPad app (.ipa)
    runs-on: macos-26
    permissions:
      contents: write # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      # No Apple account in CI: build unsigned, SideStore signs on the iPad.
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          # A tag v1.2 gives version 1.2; other builds keep the version from project.yml.
          VERSION=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=("MARKETING_VERSION=${GITHUB_REF_NAME#v}"); fi
          xcodebuild build \
            -project BetterNotes.xcodeproj \
            -scheme BetterNotes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${VERSION[@]}" \
            | tail -n 200

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BetterNotes.app Payload/
          zip -qry betternotes.ipa Payload
          ls -lh betternotes.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: betternotes-ipa
          path: ios/betternotes.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ios/betternotes.ipa \
            --title "$GITHUB_REF_NAME" --generate-notes \
            ${{ startsWith(github.ref_name, 'v0.0.') && '--prerelease' || '' }}

  ui-tests:
    name: UI screenshots (simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        working-directory: ios
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate

      - name: Run UI tests on an iPad simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEVICES=$(xcrun simctl list devices available)
          UDID=$(echo "$DEVICES" | grep "iPad Air 11-inch" | head -n 1 | grep -oE "[0-9A-F-]{36}" || true)
          if [ -z "$UDID" ]; then UDID=$(echo "$DEVICES" | grep "iPad" | head -n 1 | grep -oE "[0-9A-F-]{36}"); fi
          echo "$DEVICES" | grep "$UDID"
          xcodebuild test \
            -project BetterNotes.xcodeproj \
            -scheme BetterNotes \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath ui.xcresult \
            | tail -n 200

      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path ios/ui.xcresult --output-path screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots
